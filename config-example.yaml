discord:
  token_env: DISCORD_BOT_TOKEN
  # Set for fast command registration while developing in one server.
  development_guild_id:
database_path: data/llmcord.sqlite3
history_retention_days: 90
models:
  dialogue: openai/main
  director: openai/main
  memory: openai/main
  profiles:
    openai/main:
      provider: openai
      model: YOUR_OPENAI_MODEL
      api_key_env: OPENAI_API_KEY
      context_tokens: 32000
      supports_images: true
      # Seconds a model request may wait for data (first token or next chunk)
      # before failing; a stream that keeps sending is not cut off. Retries
      # apply after a failed or timed-out request.
      # timeout_seconds: 120
      # max_retries: 1
    anthropic/main:
      provider: anthropic
      model: YOUR_ANTHROPIC_MODEL
      api_key_env: ANTHROPIC_API_KEY
      context_tokens: 32000
      supports_images: true
    ollama/main:
      provider: compatible
      model: YOUR_LOCAL_MODEL
      # In Compose, use host.docker.internal if Ollama runs on the Pi host.
      # Use the model server's LAN or tailnet address if it runs elsewhere.
      base_url: http://localhost:11434/v1
      context_tokens: 8192
      supports_images: false
      # Slow local models: raise timeout_seconds (prompt processing before the
      # first token counts), and consider max_retries: 0 so a slow request is
      # not repeated.
      # timeout_seconds: 300
      # max_retries: 0
limits:
  max_input_tokens: 12000
  max_output_tokens: 700
  max_images: 3
  max_attachment_bytes: 8388608
  max_speakers: 3
  recent_messages: 12
  recent_window_seconds: 600
  ambient_cooldown_seconds: 120
