x-llmcord: &llmcord
  image: ${LLMCORD_IMAGE:-llmcord:local}
  build: .
  env_file:
    - .env
  volumes:
    - type: bind
      source: ./config.yaml
      target: /usr/src/app/config.yaml
      read_only: true
      bind:
        create_host_path: false
    - ./data:/usr/src/app/data

services:
  migrate:
    <<: *llmcord
    command: ["python", "migrate.py"]
  bot:
    <<: *llmcord
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    <<: *llmcord
    command: ["python", "web_main.py"]
    restart: unless-stopped
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
