<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}llmcord admin{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background:#12141d; color:#edf0f8 }
    * { box-sizing:border-box } body { max-width:1200px; margin:auto; padding:1.5rem }
    a { color:#b1c7ff } h1,h2,h3 { line-height:1.15 } h2 { margin-top:0 }
    header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:2rem }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1rem }
    .card { background:#1e2230; border:1px solid #343a50; border-radius:12px; padding:1.2rem; margin-bottom:1rem }
    .wide { grid-column:1/-1 } form { display:grid; gap:.65rem; margin:.6rem 0 1rem }
    .inline { display:flex; align-items:center; flex-wrap:wrap; gap:.5rem }
    label { display:block; font-weight:600; font-size:.9rem }
    input,select,textarea,button { font:inherit; border-radius:6px; padding:.5rem; border:1px solid #596177 }
    input,select,textarea { width:100%; background:#11131b; color:#edf0f8 }
    input[type=checkbox] { width:auto } textarea { min-height:5rem; resize:vertical }
    button { width:max-content; cursor:pointer; color:#101522; background:#b4c7ff; border-color:#b4c7ff; font-weight:700 }
    button.secondary { background:transparent; color:#edf0f8; border-color:#596177 }
    button.danger { background:#e7a6ae; border-color:#e7a6ae }
    .muted { color:#a9b1c4 } .small { font-size:.85rem } .row { border-top:1px solid #343a50; padding:.8rem 0 }
    .avatar { width:64px; height:64px; object-fit:cover; border-radius:10px }
    .badge { display:inline-block; border:1px solid #67718b; border-radius:1rem; padding:.05rem .5rem; font-size:.8rem }
    .warning { color:#ffce88 } details { margin:.75rem 0 } summary { cursor:pointer; font-weight:600 }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#11131b; padding:.8rem; border-radius:6px }
    .columns { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.75rem }
  </style>
</head>
<body>
  <header><div><a href="/">llmcord</a> <span class="muted">/ admin</span></div>{% block header %}{% endblock %}</header>
  {% block content %}{% endblock %}
</body>
</html>
